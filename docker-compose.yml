services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samsung
      POSTGRES_PASSWORD: samsung
      POSTGRES_DB: samsung_phones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samsung -d samsung_phones"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
